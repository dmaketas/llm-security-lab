[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-lab"
version = "0.2.0"
description = "Practical experiments for securing LLM-enabled enterprise applications."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Dimitris Maketas"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
